name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (JUnit + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: inventory-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: inventory-service/target/surefire-reports/
          retention-days: 14

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            inventory-app/package-lock.json
            e2e-tests/package-lock.json

      - name: Start database and backend
        run: docker compose up -d --build

      - name: Build and start frontend
        working-directory: inventory-app
        run: |
          npm ci
          npm run build
          nohup npm start -- -p 3000 > ../frontend.log 2>&1 &

      - name: Wait for backend and frontend
        run: |
          for i in $(seq 1 90); do
            backend=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/products || true)
            frontend=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            echo "backend=$backend frontend=$frontend"
            # Backend answers 401/403 without a token once it is up
            if [ "$frontend" = "200" ] && { [ "$backend" = "401" ] || [ "$backend" = "403" ]; }; then exit 0; fi
            sleep 2
          done
          echo "Services did not start in time"; exit 1

      - name: Install Playwright
        working-directory: e2e-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e-tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e-tests/playwright-report/
            e2e-tests/test-results/
          retention-days: 14

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose logs --no-color inventory-service | tail -200
          tail -100 frontend.log || true
