# Sits between the public tunnel and the backend while developing (make tunnel).
# Only Shopify's webhook call gets through; the rest of the API, including login, stays private.
server {
    listen 8089;
    client_max_body_size 5m;

    # Look the backend up again (Docker's DNS) so rebuilding it doesn't break a running tunnel
    resolver 127.0.0.11 valid=10s;
    set $backend http://inventory-service:8080;

    location = /api/webhooks/shopify {
        limit_except POST { deny all; }
        proxy_pass $backend;
    }

    location / {
        return 404;
    }
}
