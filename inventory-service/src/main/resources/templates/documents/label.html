<!DOCTYPE html>
<!-- Phase O: the fake courier's test label, 100 x 150 mm like a thermal label. Filled from FakeCourierClient. -->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" />
  <title th:text="${d.tracking}">Label</title>
  <style>
    @page { size: 100mm 150mm; margin: 5mm; }
    body { font-family: "Liberation Sans"; font-size: 10pt; color: #000; margin: 0; }
    .carrier { font-size: 16pt; font-weight: 700; border-bottom: 1.5pt solid #000; padding-bottom: 2mm; }
    .test { float: right; font-size: 12pt; border: 1.5pt solid #000; padding: 0 2mm; }
    .label { font-size: 7pt; font-weight: 700; text-transform: uppercase; margin-top: 4mm; }
    .to { font-size: 12pt; line-height: 1.3; }
    .tracking { font-size: 14pt; font-weight: 700; letter-spacing: 1pt; margin-top: 6mm; border: 1pt solid #000; padding: 3mm; text-align: center; }
  </style>
</head>
<body>
  <div class="carrier"><span class="test">TEST</span><span th:text="${d.carrier}">Royal Mail Tracked 48</span></div>
  <div class="label">Deliver to</div>
  <div class="to"><div th:each="line : ${d.to}" th:text="${line}">Address</div></div>
  <div class="label">Reference</div>
  <div th:text="${d.reference}">SO-1</div>
  <div class="label">Parcels</div>
  <div th:text="${d.parcels}">1</div>
  <div class="tracking" th:text="${d.tracking}">FK000000001GB</div>
  <div class="label">Test label from the fake courier: not valid for posting</div>
</body>
</html>
