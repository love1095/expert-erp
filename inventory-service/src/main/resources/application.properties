spring.application.name=inventory-service

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=inventory
spring.datasource.password=inventory123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Flyway — schema is managed by migrations in db/migration.
# Databases created before Flyway are baselined at V1 (the pre-Flyway schema).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT — signing key (base64, >= 32 bytes) comes from the APP_JWT_SECRET environment variable
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration=86400000
app.encryption.key=${APP_ENCRYPTION_KEY:}

# Multi-tenancy
spring.jpa.properties.hibernate.multiTenancy=DISCRIMINATOR
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.experterp.backend.multitenancy.TenantResolver

# CSV imports (customers)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
