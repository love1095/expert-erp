spring.application.name=inventory-service

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=inventory
spring.datasource.password=inventory123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Flyway — schema is managed by migrations in db/migration.
# Databases created before Flyway are baselined at V1 (the pre-Flyway schema).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT — signing key (base64, >= 32 bytes) comes from the APP_JWT_SECRET environment variable
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration=86400000
app.encryption.key=${APP_ENCRYPTION_KEY:}
# The platform super admin's password, used when it is first made (see .env.example)
app.super-admin.password=${APP_SUPERADMIN_PASSWORD:}

# Multi-tenancy
spring.jpa.properties.hibernate.multiTenancy=DISCRIMINATOR
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.experterp.backend.multitenancy.TenantResolver

# CSV imports (customers)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Phase K4: Making Tax Digital (HMRC Developer Hub credentials; the sandbox until live ones are set)
app.hmrc.base-url=${APP_HMRC_BASE_URL:https://test-api.service.hmrc.gov.uk}
app.hmrc.client-id=${APP_HMRC_CLIENT_ID:}
app.hmrc.client-secret=${APP_HMRC_CLIENT_SECRET:}
app.hmrc.redirect-uri=${APP_HMRC_REDIRECT_URI:}
app.hmrc.vendor-public-ip=${APP_HMRC_VENDOR_PUBLIC_IP:}

# Phase L: Xero API link — fake (in-memory, the default) or live (needs the owner's Xero developer app)
app.xero.mode=${APP_XERO_MODE:fake}
app.xero.client-id=${APP_XERO_CLIENT_ID:}
app.xero.client-secret=${APP_XERO_CLIENT_SECRET:}
app.xero.redirect-uri=${APP_XERO_REDIRECT_URI:}
app.xero.sync-every=${APP_XERO_SYNC_EVERY:30000}
app.xero.pull-every=${APP_XERO_PULL_EVERY:300000}
# Xero webhooks (live): the signing key from the Xero developer app
app.xero.webhook-key=${APP_XERO_WEBHOOK_KEY:}

# Phase M: e-mail — fake (kept in the outbox, the default) or live (SMTP, needs the mail library: owner's OK)
app.mail.mode=${APP_MAIL_MODE:fake}
